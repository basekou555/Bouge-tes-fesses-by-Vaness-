<!doctype html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Absolut Coach, jeu de simulation de carrière dans le football à travers les époques : entraîneur·euse ou joueur·euse, avec les vrais clubs et les vrais joueurs.">
  <meta name="theme-color" content="#0b1210">
  <meta name="color-scheme" content="dark">
  <title>Absolut Coach</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚽</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Libre+Baskerville:ital,wght@0,400;0,700;1,400&family=Inter:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="credit-strip" id="homeCreditStrip"><span>Concept de jeu inspiré d'<b>Absolut Director</b> (Feuille2Cedric) · adaptation football</span></div>
  <div class="filmstrip" id="filmstrip" style="display:none;"></div>
  <header id="gameTopBanner" class="game-banner" style="display:none;">
    <button class="brand display brand-button" type="button" onclick="goHomeFromGame()" title="Retour à l'accueil">ABSOLUT COACH<span>.</span></button>
    <div class="edition-label" id="editionLabel">Une vie de football à travers les époques</div>
    <button class="dash-btn" id="dashBtn" type="button" style="display:none">📊 Tableau de bord</button>
  </header>
  <main class="app" id="app" aria-live="polite"></main>
  <noscript>Ce jeu nécessite JavaScript pour fonctionner.</noscript>
  <script src="profile.js"></script>
  <script src="players.js"></script>
  <script src="eras.js"></script>
  <script src="content.js"></script>
  <script src="core.js"></script>
  <script src="match.js"></script>
  <script src="coach.js"></script>
  <script src="player.js"></script>
  <script src="ui.js"></script>
</body>
</html>
